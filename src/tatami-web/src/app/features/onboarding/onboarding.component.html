<section class="onboarding-card">
  <h1>Configurar academia</h1>
  <p>Olá, <strong>{{ ownerName }}</strong>. Complete os dados da sua academia.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Nome da academia
      <input type="text" formControlName="academyName" />
    </label>

    <label>
      Esporte principal
      <select formControlName="sport">
        @for (sport of sports; track sport.value) {
          <option [value]="sport.value">{{ sport.label }}</option>
        }
      </select>
    </label>

    <label>
      Preço mensal (R$)
      <input type="number" formControlName="monthlyPrice" min="0" step="0.01" />
    </label>

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }

    <button type="submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Criando...' : 'Criar academia' }}
    </button>
  </form>
</section>
